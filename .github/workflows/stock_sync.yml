name: Stock Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "0 23 * * 1-5"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run stock sync
        run: |
          python scripts/scheduler.py